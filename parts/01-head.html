<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teleprompter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
:root {
  --bg: #111318; --surface: #171a20; --raised: #1f232b; --raised2: #272c36; --sunk: #0c0d11;
  --edge: #2a2f39; --edge2: #3a414e;
  --ink: #ece8dd; --ink2: #c3c6cd; --mute: #868c98; --faint: #5b6170;
  --amber: #f2a93b; --amber-ink: #1c1203; --rec: #ff4f4f; --cue: #6ec6ff; --ok: #5fd38f; --warn: #ff6b6b;
  --r-lg: 18px; --r: 12px; --r-sm: 8px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --accent: var(--amber);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--amber); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 12px; background: var(--sunk); border: 1px solid var(--edge); border-radius: 5px; padding: 1px 5px; white-space: nowrap; }
.muted { color: var(--mute); }
.small { font-size: 12px; }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.hint { margin: 0; color: var(--faint); font-size: 12px; line-height: 1.5; }
.hint code { color: var(--mute); }
h2.label { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink2); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- cabeçalho ---------- */
#control { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--edge); background: var(--surface); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; margin-right: 4px; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px rgba(242,169,59,.6); }
.brand .dot.live { background: var(--rec); box-shadow: 0 0 14px var(--rec); animation: pulse 1.2s infinite; }
.screens { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 10px; border: 1px solid var(--edge); }
.screens .scr { padding: 6px 16px; border-radius: 7px; border: 0; background: transparent; color: var(--mute); font-weight: 600; font-size: 13px; }
.screens .scr.active { background: var(--raised2); color: var(--ink); }
.lamps { display: flex; gap: 16px; }
.lamp { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--mute); white-space: nowrap; }
.lamp i { width: 8px; height: 8px; border-radius: 50%; background: #3a3f4a; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); flex: none; }
.lamp.on { color: var(--ink2); }
.lamp.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.lamp.busy i { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1s infinite; }
.lamp.bad i { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.focus-warning { display: none; font-size: 12px; color: var(--amber); }
body.editing .focus-warning { display: block; }

/* ---------- botões e campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--edge); background: linear-gradient(180deg, var(--raised2), var(--raised)); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); transition: background .12s, border-color .12s, transform .05s; white-space: nowrap; user-select: none; }
.btn:hover { border-color: var(--edge2); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.primary { background: linear-gradient(180deg, #ffbd57, var(--amber)); color: var(--amber-ink); border-color: #c98522; font-weight: 700; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink2); box-shadow: none; }
.btn.quiet:hover { background: var(--raised); border-color: var(--edge); }
.btn.small { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.icon-sm { width: 36px; height: 36px; padding: 0; border-radius: 10px; font-size: 17px; }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .45; cursor: default; }
label.btn input[type=file] { display: none; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--amber) var(--fill, 0%), var(--edge2) var(--fill, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #f7f3ea; border: 2px solid var(--amber); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--edge2); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--amber); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #f7f3ea; border: 2px solid var(--amber); }
input[type=color] { width: 38px; height: 26px; border: 1px solid var(--edge); border-radius: 6px; background: transparent; padding: 0 2px; cursor: pointer; }
input[type=checkbox] { accent-color: var(--amber); width: 16px; height: 16px; margin: 0; }
select, input[type=text], input[type=number] { background: var(--sunk); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 9px; outline: none; max-width: 100%; }
select:focus, input[type=text]:focus, input[type=number]:focus { border-color: var(--edge2); }

.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--edge); }
.field:last-child { border-bottom: 0; }
.field > label { color: var(--ink2); font-size: 13px; }
.field .val { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--mute); min-width: 4ch; text-align: right; }
.field.range input[type=range] { grid-column: 1 / -1; }
.field.check > label { cursor: pointer; }
.field.action { grid-template-columns: 1fr; }
.group-title { font-size: 12px; color: var(--mute); margin: 14px 0 2px; }
.group-title:first-child { margin-top: 0; }

.tabs { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 10px; border: 1px solid var(--edge); }
.tab { flex: 1; padding: 7px 4px; border-radius: 7px; text-align: center; font-size: 12.5px; color: var(--mute); border: 0; background: transparent; }
.tab.active { background: var(--raised2); color: var(--ink); }
.tabpane { display: flex; flex-direction: column; gap: 10px; }

.kbd { display: inline-block; font: 11px/1 var(--mono); padding: 4px 6px; border: 1px solid var(--edge2); border-bottom-width: 2px; border-radius: 5px; background: var(--sunk); color: var(--ink); min-width: 22px; text-align: center; }
table.keys { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.keys td { padding: 6px 4px; border-bottom: 1px solid var(--edge); vertical-align: middle; }
table.keys td:first-child { white-space: nowrap; width: 1%; }
table.keys td:last-child { color: var(--ink2); }

/* ---------- telas ---------- */
.screen { min-height: 0; overflow: auto; transition: padding-right .2s; container-type: inline-size; }
#control.drawer-open .screen { padding-right: min(400px, 100vw); }
@media (max-width: 900px) { #control.drawer-open .screen { padding-right: 0; } }

/* tela de controle: monitor + mesa */
.run-wrap { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 23vw, 290px); gap: 20px; align-items: start; max-width: 1400px; margin: 0 auto; padding: 20px 22px 30px; }
@container (max-width: 700px) { .run-wrap { grid-template-columns: 1fr; } .deck { max-width: 520px; margin: 0 auto; width: 100%; } }

.monitor { background: var(--sunk); border-radius: var(--r-lg); padding: 10px 10px 8px; box-shadow: 0 0 0 1px var(--edge), inset 0 1px 0 rgba(255,255,255,.04), 0 40px 70px -40px rgba(0,0,0,.9); }
.monitor-bar { display: flex; align-items: center; gap: 10px; padding: 2px 6px 10px; font-size: 12.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
.monitor-bar .what { color: var(--ink2); }
.tally { width: 9px; height: 9px; border-radius: 50%; background: #343946; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); flex: none; }
.tally.on { background: var(--rec); box-shadow: 0 0 10px var(--rec), 0 0 2px var(--rec); }
.glass { border-radius: 10px; overflow: hidden; background: #000; }
.stage.preview { aspect-ratio: 16 / 9.4; width: 100%; }
.monitor-foot { padding: 10px 6px 2px; display: flex; flex-direction: column; gap: 2px; }
.monitor-foot .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }

.deck { display: flex; flex-direction: column; gap: 20px; padding-top: 2px; min-width: 0; }
.mode { display: flex; flex-direction: column; gap: 6px; }
.mode button { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--r); border: 1px solid var(--edge); background: var(--surface); color: var(--mute); text-align: left; font-weight: 600; font-size: 13.5px; }
.mode button i { width: 10px; height: 10px; border-radius: 50%; background: #343946; box-shadow: inset 0 0 0 1px rgba(0,0,0,.5); flex: none; }
.mode button.active { background: var(--raised); border-color: var(--edge2); color: var(--ink); }
.mode button.active i { background: var(--amber); box-shadow: 0 0 8px rgba(242,169,59,.7); }
.mode button small { display: block; font-weight: 400; color: var(--faint); font-size: 12px; }

.transport { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.tbtn { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--edge); background: linear-gradient(180deg, var(--raised2), var(--raised)); color: var(--ink2); font-size: 15px; display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.4); }
.tbtn:hover { color: var(--ink); border-color: var(--edge2); }
.tbtn:active { transform: translateY(1px); box-shadow: none; }
.tbtn.play { width: 66px; height: 66px; font-size: 26px; color: var(--amber-ink); background: radial-gradient(circle at 50% 30%, #ffc96a, var(--amber) 70%); border-color: #c98522; box-shadow: 0 0 0 6px rgba(242,169,59,.12), 0 6px 14px rgba(0,0,0,.5); }
.tbtn.play.on { box-shadow: 0 0 0 6px rgba(255,79,79,.18), 0 0 24px rgba(242,169,59,.45), 0 6px 14px rgba(0,0,0,.5); }

.speed-block { display: flex; flex-direction: column; gap: 6px; }
.speed-block .head { display: flex; align-items: baseline; justify-content: space-between; }
.speed-block .head .lbl { font-size: 13px; color: var(--ink2); }
.readout { font-size: 30px; font-weight: 300; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1; }
.readout small { font-size: 12px; color: var(--mute); letter-spacing: 0; margin-left: 4px; font-weight: 400; }
.speed-block .ctl { display: flex; align-items: center; gap: 8px; }
.speed-block .ctl .btn { width: 32px; padding: 0; height: 28px; }

.voice-panel { display: flex; flex-direction: column; gap: 8px; }
.voice-panel .head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.voice-status { font-size: 12.5px; color: var(--mute); }
.voice-status.ok { color: var(--ok); }
.voice-status.busy { color: var(--amber); }
.voice-status.bad { color: var(--warn); }
.transcript { min-height: 72px; max-height: 160px; overflow: auto; padding: 10px 12px; background: var(--sunk); border-radius: var(--r); border: 1px solid var(--edge); font-size: 13px; color: var(--faint); line-height: 1.55; }
.transcript .final { color: var(--ink2); }
.transcript .interim { color: var(--mute); font-style: italic; }
.keys-hint { color: var(--faint); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0; }
.keys-hint span.k { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
#control.mode-auto .only-voice { display: none !important; }
#control.mode-voice .only-auto:not(.only-hybrid) { display: none !important; }
#control.mode-voice:not(.hybrid) .only-hybrid { display: none !important; }

/* tela do roteiro */
.edit-wrap { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; padding: 22px 24px; max-width: 1400px; margin: 0 auto; }
.edit-wrap > section { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 900px) { .edit-wrap { grid-template-columns: 1fr; height: auto; } .edit-wrap .rendered-col { min-height: 320px; } }
.edit-wrap .toolbar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.edit-wrap .toolbar .stats { margin-left: auto; font-size: 12.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
textarea.editor { flex: 1; min-height: 260px; resize: none; background: var(--sunk); border: 1px solid var(--edge); border-radius: var(--r); padding: 16px 18px; font: 14px/1.65 var(--mono); color: #d9d6cc; outline: none; tab-size: 2; }
textarea.editor:focus { border-color: var(--amber); }
.dropzone.over textarea.editor { border-color: var(--cue); box-shadow: 0 0 0 3px rgba(110,198,255,.25); }
.rendered-col .monitor { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.rendered-col .glass { flex: 1; min-height: 0; }
.stage.static { height: 100%; min-height: 240px; }
.stage.static .viewport { overflow: auto; padding: 4% 0; }
.stage.static .content { transform: none !important; }
.stage.static .rline, .stage.static .hud, .stage.static .blankout, .stage.static .cam { display: none; }

/* ---------- gaveta de ajustes ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); background: var(--surface); border-left: 1px solid var(--edge); z-index: 21; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,.45); }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--edge); }
.drawer-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
.drawer-body { padding: 14px 16px 28px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.pedal-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--edge); }
.pedal-row .name { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.pedal-row .key.recording { border-color: var(--amber); color: var(--amber); animation: pulse 1s infinite; }
.hid-bytes { font: 11px var(--mono); color: var(--faint); word-break: break-all; }
